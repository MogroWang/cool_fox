name: Build

on:
  # Every pull request, on any branch it targets.
  pull_request:
  # What lands on main, merged pull requests included.
  push:
    branches: [main]
  # Runs by hand from the Actions tab, or `gh workflow run Build`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The release command of README.md, unchanged.
      - name: Build
        run: cargo build --release --locked -p victory
      # Both launchers of README.md, each with the layout it looks for:
      # Play-VIctory.cmd wants the runner under this name beside itself, and
      # scripts/play.ps1 wants target\release\victory.exe above it.
      - name: Stage the portable folder
        shell: pwsh
        run: |
          $stage = 'stage/victory-windows-x64'
          New-Item -ItemType Directory -Force "$stage/target/release", "$stage/scripts" | Out-Null
          Copy-Item target/release/victory.exe "$stage/target/release/victory.exe"
          Copy-Item target/release/victory.exe "$stage/victory-3d-rtx-pareto-residency.exe"
          Copy-Item Play-VIctory.cmd, victory.example.toml, README.md $stage
          Copy-Item scripts/play.ps1 "$stage/scripts/play.ps1"
      - name: Upload the Windows x64 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: victory-windows-x64
          path: stage/victory-windows-x64
          if-no-files-found: error
          retention-days: 14
      # The build README.md's measurements are of, and the one that logs why a
      # draw was dropped: `scripts\play.ps1` takes it with its default -Build.
      - name: Build, diagnostics
        run: cargo build --profile diag --locked -p victory --features diagnostics
      - name: Stage the diagnostics folder
        shell: pwsh
        run: |
          $stage = 'stage-diag/victory-windows-x64-diag'
          New-Item -ItemType Directory -Force "$stage/target/diag", "$stage/scripts" | Out-Null
          Copy-Item target/diag/victory.exe "$stage/target/diag/victory.exe"
          Copy-Item Play-VIctory.cmd, victory.example.toml, README.md $stage
          Copy-Item scripts/play.ps1 "$stage/scripts/play.ps1"
      - name: Upload the diagnostics ZIP
        uses: actions/upload-artifact@v4
        with:
          name: victory-windows-x64-diag
          path: stage-diag/victory-windows-x64-diag
          if-no-files-found: error
          retention-days: 14
